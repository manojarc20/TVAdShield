name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Tests, lint, and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platforms;android-24 platforms;android-35 build-tools;35.0.0 platform-tools ndk;27.2.12479018

      - name: Build pinned HEV native engine for API 24
        run: |
          hev_dir="$RUNNER_TEMP/hev-socks5-tunnel"
          git clone --no-checkout https://github.com/heiher/hev-socks5-tunnel.git "$hev_dir"
          git -C "$hev_dir" checkout --detach d9dca26c7ad0e494492244f0309e80ee583e739e
          git -C "$hev_dir" submodule update --init --recursive --depth 1
          sed -i 's/^APP_PLATFORM := android-29$/APP_PLATFORM := android-24/' "$hev_dir/Application.mk"
          grep -qx 'APP_PLATFORM := android-24' "$hev_dir/Application.mk"
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" \
            NDK_PROJECT_PATH="$hev_dir" \
            APP_BUILD_SCRIPT="$hev_dir/Android.mk" \
            NDK_APPLICATION_MK="$hev_dir/Application.mk" \
            APP_ABI="arm64-v8a,armeabi-v7a,x86_64,x86" \
            APP_PLATFORM=android-24
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$hev_dir/libs/$abi/libhev-socks5-tunnel.so" "app/src/main/jniLibs/$abi/"
          done
          find app/src/main/jniLibs -name libhev-socks5-tunnel.so -size +0c | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle configuration
        run: ./gradlew --no-daemon --version

      - name: Run all JVM unit tests
        run: ./gradlew --no-daemon test

      - name: Run Android static analysis
        run: ./gradlew --no-daemon lint

      - name: Print detailed lint report on failure
        if: always()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; else echo "No detailed lint report was generated."; fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            entries="$(unzip -Z1 "$apk")"
            for abi in arm64-v8a armeabi-v7a x86_64 x86; do
              grep -Fxq "lib/$abi/libhev-socks5-tunnel.so" <<< "$entries"
            done
            unzip -p "$apk" assets/third-party-notices.txt | grep -q "hev-socks5-tunnel:"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tvadshield-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: tvadshield-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
